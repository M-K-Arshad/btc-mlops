apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: btc-api-ingress
  labels: { app: btc-api }
spec:
  ingressClassName: nginx
  rules:
    - host: btc-forecast.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: btc-api-svc
                port:
                  number: 80
