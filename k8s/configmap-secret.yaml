apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-config
  labels: { app: btc-api }
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
  GUNICORN_WORKERS: "2"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-secret
  labels: { app: btc-api }
type: Opaque
stringData:
  API_KEY: "btc-super-secret-key-2026"
