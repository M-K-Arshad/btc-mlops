apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels: { app: load-generator }
  template:
    metadata:
      labels: { app: load-generator }
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - >
              while true; do
              wget -q -O /dev/null --header='Content-Type: application/json'
              --post-data='{"forecast_days":7}' http://btc-api-svc/predict;
              done
